name: blogger
services:
  blogger:
    image: ghcr.io/sadensmol/blogger:${BLOGGER_IMAGE_TAG:-latest}
    container_name: blogger
    restart: unless-stopped
    env_file: [settings.env, .env]
    mem_limit: 1536m
    stop_grace_period: 30s
    volumes:
      - blogger-data:/data
      - ./codex:/home/blogger/.codex
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  updater:
    image: docker:28-cli
    container_name: blogger-updater
    restart: unless-stopped
    entrypoint: ["sh", "./updater.sh"]
    working_dir: ${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside, so compose bind mounts resolve on the host.
      - ${PWD}:${PWD}
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "2"}
  ollama:
    profiles: [local]
    image: ollama/ollama:latest
    runtime: nvidia
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes: [ollama-models:/root/.ollama]
volumes:
  blogger-data:
  ollama-models:
